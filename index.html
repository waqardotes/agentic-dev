<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Task List</title>
  <style>
    :root{--bg:#f6f8fa;--card:#fff;--accent:#2563eb;--muted:#6b7280}
    html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#111}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px}
    .card{width:100%;max-width:720px;background:var(--card);border-radius:12px;padding:24px;box-shadow:0 6px 18px rgba(16,24,40,0.06)}
    h1{margin:0 0 12px;font-size:20px}
    form{display:flex;gap:8px;margin-bottom:16px}
    input[type=text]{flex:1;padding:10px 12px;border:1px solid #e6e9ef;border-radius:8px;font-size:15px}
    button{background:var(--accent);color:#fff;border:0;padding:10px 14px;border-radius:8px;font-weight:600;cursor:pointer}
    button.secondary{background:#efefef;color:#111}
    ul#tasks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
    li.task{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;border:1px solid #f0f2f5}
    label.task-label{flex:1;display:flex;align-items:center;gap:12px;cursor:pointer}
    .task-text{font-size:15px}
    .done .task-text{opacity:0.6;text-decoration:line-through}
    .meta{margin-top:14px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between}
    .btn-delete{background:transparent;border:0;color:#ef4444;font-weight:700;cursor:pointer}
    .status{margin-bottom:12px;padding:10px 12px;border-radius:8px;font-size:13px;display:none}
    .status.error{display:block;background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
    .status.warn{display:block;background:#fffbeb;border:1px solid #fde68a;color:#92400e}
    @media (max-width:480px){.card{padding:16px}}
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card" role="main">
      <h1>Tasks</h1>
      <form id="task-form" aria-label="Add task">
        <input id="task-input" type="text" placeholder="Add a new task and press Enter" autocomplete="off" />
        <button id="add-btn" type="submit">Add</button>
      </form>
      <div id="status" class="status" role="alert" aria-live="assertive"></div>
      <ul id="tasks" aria-live="polite"></ul>
      <div class="meta">
        <div id="count">0 tasks</div>
        <div>
          <button id="clear-completed" class="secondary">Clear Completed</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    (function(){
      const STORAGE_KEY = 'tasks:v1';
      const form = document.getElementById('task-form');
      const input = document.getElementById('task-input');
      const list = document.getElementById('tasks');
      const countEl = document.getElementById('count');
      const clearBtn = document.getElementById('clear-completed');
      const statusEl = document.getElementById('status');

      let tasks = [];

      function showStatus(message, kind){
        statusEl.textContent = message;
        statusEl.className = 'status ' + (kind || 'error');
      }

      function clearStatus(){
        statusEl.textContent = '';
        statusEl.className = 'status';
      }

      function describeError(err){
        return err && err.message ? err.message : 'unknown error';
      }

      function save(){
        try{
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          return true;
        }catch(err){
          console.error('Failed to persist tasks', err);
          const quotaExceeded = err instanceof DOMException &&
            (err.name === 'QuotaExceededError' || err.name === 'NS_ERROR_DOM_QUOTA_REACHED');
          showStatus(quotaExceeded
            ? 'Storage is full, so this change was not saved. Delete some tasks and try again.'
            : 'Could not save your tasks (' + describeError(err) + '). Changes will be lost when you reload.');
          return false;
        }
      }

      function isValidTask(t){
        return !!t && typeof t === 'object' && typeof t.id === 'string' && typeof t.text === 'string';
      }

      function load(){
        let raw;
        try{
          raw = localStorage.getItem(STORAGE_KEY);
        }catch(err){
          console.error('Failed to read stored tasks', err);
          tasks = [];
          showStatus('Could not read saved tasks (' + describeError(err) + '). Starting with an empty list.');
          return;
        }

        if(!raw){ tasks = []; return }

        let parsed;
        try{
          parsed = JSON.parse(raw);
        }catch(err){
          console.error('Stored tasks are not valid JSON', err);
          tasks = [];
          showStatus('Saved tasks were corrupted and could not be loaded. Starting with an empty list.');
          return;
        }

        if(!Array.isArray(parsed)){
          console.error('Stored tasks have an unexpected shape', parsed);
          tasks = [];
          showStatus('Saved tasks were in an unexpected format and could not be loaded. Starting with an empty list.');
          return;
        }

        tasks = parsed.filter(isValidTask).map(t => ({id: t.id, text: t.text, done: !!t.done}));
        const skipped = parsed.length - tasks.length;
        if(skipped > 0){
          console.warn('Skipped ' + skipped + ' invalid stored task(s)');
          showStatus('Skipped ' + skipped + ' saved task(s) that could not be read.', 'warn');
        }
      }

      function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7) }

      function render(){
        list.innerHTML = '';
        tasks.forEach(t => {
          const li = document.createElement('li');
          li.className = 'task' + (t.done ? ' done' : '');
          li.dataset.id = t.id;

          const label = document.createElement('label');
          label.className = 'task-label';

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = !!t.done;
          checkbox.addEventListener('change', ()=> toggle(t.id));

          const span = document.createElement('span');
          span.className = 'task-text';
          span.textContent = t.text;

          label.appendChild(checkbox);
          label.appendChild(span);

          const del = document.createElement('button');
          del.className = 'btn-delete';
          del.textContent = 'Delete';
          del.addEventListener('click', ()=> removeTask(t.id));

          li.appendChild(label);
          li.appendChild(del);
          list.appendChild(li);
        });

        const total = tasks.length;
        const remaining = tasks.filter(t=>!t.done).length;
        countEl.textContent = remaining + (remaining===1 ? ' task' : ' tasks') + ' remaining';
      }

      function addTask(text){
        const trimmed = (text || '').trim();
        if(!trimmed) return;
        clearStatus();
        tasks.unshift({id:uid(), text: trimmed, done:false});
        commit();
      }

      function removeTask(id){
        clearStatus();
        tasks = tasks.filter(t=>t.id !== id);
        commit();
      }

      function toggle(id){
        clearStatus();
        const t = tasks.find(x=>x.id===id);
        if(!t){
          console.warn('Tried to toggle a task that no longer exists', id);
          showStatus('That task no longer exists.', 'warn');
          render();
          return;
        }
        t.done = !t.done;
        commit();
      }

      function clearCompleted(){
        clearStatus();
        tasks = tasks.filter(t=>!t.done);
        commit();
      }

      function commit(){
        save();
        render();
      }

      form.addEventListener('submit', e=>{
        e.preventDefault();
        addTask(input.value);
        input.value = '';
        input.focus();
      });

      clearBtn.addEventListener('click', ()=> clearCompleted());

      // initialize
      load(); render();

      // expose for debugging (optional)
      window.taskApp = {addTask, removeTask, toggle, tasks};
    })();
  </script>
</body>
</html>
